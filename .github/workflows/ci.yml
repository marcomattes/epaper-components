name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Called as the checks stage of release.yml, so the release gate and the PR
  # gate are the same definition rather than two copies that drift apart.
  workflow_call:
    secrets:
      # Optional: without it the `sonar` job reports that it skipped rather
      # than failing, so a fork PR and a token-less clone still get a green CI.
      SONAR_TOKEN:
        required: false
      # Optional for the same reason: BrowserStack reports a notice and skips
      # its matrix when the credentials are unavailable.
      BROWSERSTACK_USERNAME:
        required: false
      BROWSERSTACK_ACCESS_KEY:
        required: false

# Scoped per job rather than here, matching browserstack.yml: a workflow-level
# grant hands the token to every job whether it needs one or not, and a job
# added later inherits it silently instead of having to ask.
jobs:
  # Each stage is an explicit job so GitHub shows the gate that failed and
  # never schedules the more expensive stages behind it.
  quality:
    name: Quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --user 1001
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Prettier check
        run: npm run format:check

      - name: Lint
        run: npm run lint:check

      - name: Type check
        run: npm run type-check

  tests:
    name: Tests
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      # Keep browser rendering identical to the environment used to create the
      # visual-regression baselines. This tag must match package-lock.json.
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --user 1001
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Coverage instead of a bare run: this is the only place the browser
      # suite executes, so it is also the only place coverage can be measured.
      # Both Vitest projects (`unit` and `storybook`) report into it, and V8
      # merges them into a single reports/coverage/lcov.info.
      - name: Tests
        run: npm run test:coverage:ci

      # `if: always()` on purpose — coverage.reportOnFailure keeps the reports
      # usable after a failed assertion, and a failed run is exactly when the
      # HTML report is worth reading.
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: reports/
          retention-days: 14
          if-no-files-found: warn

  build:
    # Keep the current check name stable for branch protection.
    name: Build and test
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      # Keep the browser, its system dependencies, and visual-regression
      # rendering identical to the environment used to create CI baselines.
      # This tag must match the Playwright version in package-lock.json.
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --user 1001
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Size limit
        run: npm run size

      # Runs outside the browser on purpose: it asserts that every built entry
      # point imports in a bare Node process, which is what a framework's
      # server render gives the library.
      - name: SSR import check
        run: npm run test:ssr

      - name: Validate sample app (README claims, compiled)
        run: npm run validate:sample-app:types

      - name: Validate sample app (README claims, runtime)
        run: npm run validate:sample-app

  sonar:
    name: SonarQube
    needs: build
    runs-on: ubuntu-latest
    # Read-only, and only `contents`: the scanner reads the working tree and the
    # git history, and reports to SonarQube Cloud over its own token. Pull-request
    # decoration is written by the SonarQube Cloud GitHub App, not by this token.
    permissions:
      contents: read
    steps:
      # The scanner needs the full history: it reads git blame to decide which
      # lines are "new code" and who to assign issues to. A shallow clone makes
      # every line look like it landed in this commit.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Analysis runs outside the Playwright container and never re-runs the
      # suite; it only needs the reports the tests job already produced.
      - name: Download test and coverage reports
        uses: actions/download-artifact@v8
        with:
          name: reports
          path: reports/

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # Not for building — for `sonar.typescript.tsconfigPaths`. Without the
      # installed types the TypeScript analyzer falls back to a syntax-only
      # parse and every type-aware rule silently stops firing.
      #
      # `--ignore-scripts` for the same reason as browserstack.yml: type
      # declarations come out of the package tarballs, so nothing here needs a
      # postinstall hook, and running one in a pull_request-triggered job is
      # exposure with no upside. This job never launches a browser.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # A pull request from a fork gets no secrets, so SONAR_TOKEN is empty and
      # the scan would fail on authentication. The check has to live in the
      # shell: the `secrets` context is not available in a step-level `if`,
      # only in `env`.
      - name: Check for Sonar token
        id: token
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=SonarQube::SONAR_TOKEN is not set — skipping analysis."
          fi

      # release.yml calls this workflow again on the `v*` tag push, re-checking
      # out the same commit that already went through this job on its `main`
      # push. GITHUB_REF_NAME on a tag ref is the tag itself, so the scanner's
      # CI auto-detection reports the analysis as branch `v1.1.0` (etc.)
      # instead of `main`; SonarCloud only recognizes the configured main
      # branch (and PRs) for this project, so the quality-gate read-back for
      # that unknown branch is rejected after the upload — surfacing as
      # "Not authorized or project not found" regardless of token validity.
      # The commit was already analyzed under the right branch name, so skip
      # the repeat run rather than re-analyze under a ref Sonar will reject.
      - name: SonarQube scan
        if: steps.token.outputs.present == 'true' && github.ref_type != 'tag'
        # Pinned to a commit, not a tag: a mutable tag lets an upstream
        # compromise reach a runner that has SONAR_TOKEN. This is v8.2.1.
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          # Blocks until SonarQube Cloud has finished analysing and returns the
          # quality gate, so a failing gate fails this job rather than passing
          # CI and showing up as a red badge on the pull request half a minute
          # later. Everything else comes from sonar-project.properties.
          args: >
            -Dsonar.qualitygate.wait=true

  # No `needs`, so this runs in parallel with quality/tests/build/sonar
  # instead of adding latency in front of them. Left unconditional at the job
  # level (only its steps are conditional) so it always reports `success` —
  # a skipped *job* would cascade into skipping browserstack/preview/deploy
  # below too, which is not what a website-only change should do to preview
  # and deploy.
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      website_only: ${{ steps.filter.outputs.website_only }}
    steps:
      - name: Checkout
        if: github.event_name != 'workflow_call'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The marketing site (apps/site/ — its source, Vite config and build
      # scripts) ships to epaper-components.dev, never to npm, and none of it
      # is exercised by the BrowserStack component matrix — so a push or pull
      # request touching only that path can skip both safely. Skipped
      # entirely for the tag-release path (workflow_call from release.yml):
      # a release always gets the full gate, whatever the tag touches.
      - name: Determine changed paths
        id: filter
        if: github.event_name != 'workflow_call'
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.event.after }}"
          fi

          # A force-push or a newly created branch has no prior commit to
          # diff against (`before` is the all-zero SHA) — fall back to
          # running every gate rather than guessing what changed.
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "website_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED="$(git diff --name-only "$BASE" "$HEAD")"
          echo "$CHANGED"

          if [ -z "$CHANGED" ] || echo "$CHANGED" | grep -vE '^apps/site/' | grep -q .; then
            echo "website_only=false" >> "$GITHUB_OUTPUT"
          else
            echo "website_only=true" >> "$GITHUB_OUTPUT"
          fi

  browserstack:
    name: BrowserStack
    needs: [sonar, changes]
    # Website-only changes (see the `changes` job above) never touch
    # component code, so there is nothing for the BrowserStack matrix to catch.
    if: needs.changes.outputs.website_only != 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/browserstack.yml
    secrets:
      BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}

  # Delivery is part of the same gated chain. A pull request gets its preview;
  # main gets the production site. Tag releases deploy from release.yml after
  # publishing, so they deliberately match neither condition here.
  preview:
    name: PR preview
    needs: browserstack
    # `always()` plus the explicit result check: a website-only skip of
    # `browserstack` above is a *skip*, not a failure, and must not cascade
    # into skipping the preview deploy — only a real browserstack failure
    # should block it.
    if: >-
      always() &&
      needs.browserstack.result != 'failure' &&
      needs.browserstack.result != 'cancelled' &&
      github.event_name == 'pull_request' &&
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/preview.yml
    secrets: inherit

  deploy:
    name: Deploy site and Storybook
    needs: browserstack
    # Same reasoning as `preview` above: don't let a website-only browserstack
    # skip block the site deploy that website change was meant to publish.
    if: >-
      always() &&
      needs.browserstack.result != 'failure' &&
      needs.browserstack.result != 'cancelled' &&
      github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
