name: PR Preview

# Publishes a throwaway copy of the site and Storybook per pull request:
#
#   https://epaper-components.dev/preview/pr-<number>/
#   https://epaper-components.dev/preview/pr-<number>/storybook/
#
# and deletes it again when the pull request closes. Closing is the reliable
# signal: deleting the head branch of an open PR closes that PR, so branch
# deletion is covered without listening for the `delete` event, which does not
# carry a PR number.
#
# The preview is served from the production host, so every page is built with
# `VITE_SITE_BASE` pointing at the sub-directory. That makes the site's
# internal links resolve inside the preview instead of jumping back to the
# live site, and stamps `noindex,nofollow` on every page. `/preview/` is also
# disallowed in the production robots.txt.
#
# Uses the same secrets as deploy.yml:
#   FTP_SERVER / FTP_USERNAME / FTP_PASSWORD
#   FTP_SERVER_DIR (optional, default "/"), FTP_PROTOCOL, FTP_PORT

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read

concurrency:
  # One preview per PR. A newer push supersedes an in-flight deploy, but the
  # teardown must never be cancelled or the directory is orphaned.
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: ${{ github.event.action != 'closed' }}

env:
  PREVIEW_PATH: preview/pr-${{ github.event.pull_request.number }}

jobs:
  deploy:
    # Pull requests from forks never receive the FTP credentials, so a deploy
    # would fail with empty secrets. Skipping is explicit rather than confusing.
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # --ignore-scripts because this job checks out pull-request code: a
      # postinstall hook added in a PR would otherwise run in the same job
      # that holds the FTP credentials. Verified against the full pipeline —
      # site, Storybook and tests all build without lifecycle scripts.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build landing site
        run: npm run build:site
        env:
          VITE_SITE_BASE: /${{ env.PREVIEW_PATH }}/
          VITE_STORYBOOK_BASE: https://epaper-components.dev/${{ env.PREVIEW_PATH }}/storybook
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Storybook
        run: npm run build-storybook
        env:
          STORYBOOK_BASE: /${{ env.PREVIEW_PATH }}/storybook/

      - name: Assemble preview
        run: |
          rm -rf site
          mkdir -p site/storybook
          cp -r dist-site/. site/
          cp -r storybook-static/. site/storybook/

      - name: Sync to FTP
        # Pinned to a commit rather than a tag: a tag can be moved to point
        # at new code, and this action is handed the deployment credentials.
        uses: SamKirkland/FTP-Deploy-Action@8e83cea8672e3fbcbb9fdafff34debf6ae4c5f65 # v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ vars.FTP_PORT || 21 }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          local-dir: ./site/
          server-dir: ${{ vars.FTP_SERVER_DIR || '/' }}${{ env.PREVIEW_PATH }}/

      - name: Comment the preview URL
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: https://epaper-components.dev/${{ env.PREVIEW_PATH }}/
        with:
          script: |
            const marker = '<!-- pr-preview -->';
            const body = [
              marker,
              '### Preview',
              '',
              `| | |`,
              `| --- | --- |`,
              `| Site | ${process.env.PREVIEW_URL} |`,
              `| Storybook | ${process.env.PREVIEW_URL}storybook/ |`,
              '',
              `Built from ${context.sha.slice(0, 7)}. Removed when this pull request closes.`,
              '',
              '---',
              '_Generated by [Claude Code](https://claude.ai/code)_',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((c) => c.body?.includes(marker));

            // One sticky comment per PR, updated in place — a new comment on
            // every push would bury the review conversation.
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  teardown:
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      # FTP-Deploy-Action only uploads; removing a directory needs a real
      # client. lftp's `rm -r` is recursive and `-f` keeps the step green when
      # the directory never existed (PR closed before a preview was built).
      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Remove preview directory
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ vars.FTP_PORT || 21 }}
          FTP_PROTOCOL: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          SERVER_DIR: ${{ vars.FTP_SERVER_DIR || '/' }}
        run: |
          set -euo pipefail

          # Encrypted control and data channels by default. The plain-FTP
          # setting only stops *requiring* TLS — it never turns it off, so
          # lftp still negotiates it whenever the server offers it. There is
          # no code path here that transmits the password in the clear when
          # the server would have accepted TLS.
          ssl='set ftp:ssl-force true; set ftp:ssl-protect-data true;'
          if [ "$FTP_PROTOCOL" = "ftp" ]; then
            ssl='set ftp:ssl-protect-data true;'
          fi

          target="${SERVER_DIR}${PREVIEW_PATH}"
          echo "Removing ${target}"

          # --env-password keeps the secret out of argv. `rm -rf` is lftp's own
          # recursive delete; the fallback keeps the step green when the
          # directory never existed, e.g. a PR closed before its first deploy.
          LFTP_PASSWORD="$FTP_PASSWORD" lftp -c "
            ${ssl}
            open -u '${FTP_USERNAME}' --env-password -p '${FTP_PORT}' '${FTP_SERVER}';
            rm -rf '${target}';
          " || echo "Nothing to remove at ${target}"

      - name: Note the teardown on the pull request
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- pr-preview -->';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (!existing) return;
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body: [
                marker,
                '### Preview',
                '',
                'Removed — this pull request is closed.',
                '',
                '---',
                '_Generated by [Claude Code](https://claude.ai/code)_',
              ].join('\n'),
            });
