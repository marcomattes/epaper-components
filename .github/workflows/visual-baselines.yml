name: Update visual baselines

# Regenerates the committed PNG baselines for `screenshots.test.ts` and pushes
# them to a branch.
#
# Why this is a workflow rather than a local command: the baselines are
# compared pixel by pixel, and font rasterisation differs between Chromium
# builds. A baseline generated on a developer machine — or in any container
# whose Playwright build is not the pinned one — fails CI by one to four
# pixels. Running here is the only way to produce bytes that match what CI
# will compare against.
#
# Use it when a pull request adds or changes a story:
#   Actions → Update visual baselines → Run workflow → pick the branch.
#
# It only ever adds or updates files under `__screenshots__/`, and it exits
# without a commit when nothing changed.

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to regenerate baselines on
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: visual-baselines-${{ inputs.branch }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    container:
      # Must stay identical to ci.yml — that is the entire point of this job.
      image: mcr.microsoft.com/playwright:v1.59.1-noble
      options: --user 1001
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          # A PAT is not needed: pushing with GITHUB_TOKEN is allowed on
          # branches, and the push deliberately does not re-trigger CI.
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # --ignore-scripts: this job checks out a caller-chosen ref and holds
      # `contents: write`, so no dependency hook should run before the tests.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Regenerate baselines
        run: npm run test:visual:update

      - name: Commit and push
        # `inputs.branch` is attacker-controllable text. Interpolating it
        # directly into the script would splice it into the shell before bash
        # ever sees it — a branch named `x"; curl ...; echo "` would run.
        # Passing it through the environment keeps it a value, never code.
        env:
          TARGET_BRANCH: ${{ inputs.branch }}
        run: |
          # POSIX `set`, not `set -euo pipefail`: the Playwright container has
          # no bash on the runner's lookup path, so GitHub falls back to
          # `sh -e {0}` and dash rejects `-o pipefail` before the first line
          # runs. There is no pipeline here, so `-eu` is the whole guarantee.
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Only screenshots — never let a stray build artifact ride along.
          git add -- '**/__screenshots__/**'

          if git diff --cached --quiet; then
            echo "Baselines already up to date."
            exit 0
          fi

          git diff --cached --name-only
          git commit -m "test: refresh visual baselines in the pinned container

          Generated by .github/workflows/visual-baselines.yml so the bytes match
          the Playwright build ci.yml compares against."
          git push origin "HEAD:${TARGET_BRANCH}"
