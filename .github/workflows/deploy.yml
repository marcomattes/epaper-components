name: Deploy to FTP

# Publishes https://epaper-components.dev on every push to main.
#
# Unlike a plain static site, this repo has to be built first: the landing
# site and Storybook are both build outputs, so the job assembles them into
# ./site and uploads only that directory.
#
#   site/            → dist-site/       (landing site, domain root)
#   site/storybook/  → storybook-static/ (Storybook, /storybook)
#
# Required repository secrets (Settings → Secrets and variables → Actions → Secrets):
#   FTP_SERVER     hostname, e.g. ftp.your-host.com
#   FTP_USERNAME   FTP user
#   FTP_PASSWORD   FTP password
#
# Optional repository variables (… → Variables):
#   FTP_SERVER_DIR target directory on the server (default "/"; e.g. "/public_html/")
#   FTP_PROTOCOL   "ftps" (default, encrypted) | "ftp" (plain) | "ftps-legacy"
#   FTP_PORT       default 21

on:
  # Main-branch deploys are called by ci.yml after every preceding gate passed;
  # tagged releases call this after publishing from release.yml.
  workflow_dispatch: {}
  workflow_call: {}

permissions:
  contents: read

# Never run two deploys at once — the second waits, the queued older one is dropped.
concurrency:
  group: ftp-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The landing site deep-links into the deployed Storybook, so it needs
      # the public base URL at build time rather than the localhost default.
      # GITHUB_TOKEN lifts the anonymous GitHub API rate limit for the star
      # count baked into the cover. The build falls back to the committed
      # number in scripts/github-stars.mjs if the call fails, so a rate-limited
      # or offline run still deploys.
      - name: Build landing site
        run: npm run build:site
        env:
          VITE_SITE_BASE: /
          VITE_STORYBOOK_BASE: https://epaper-components.dev/storybook
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Storybook is served from a sub-path, so its asset base must match or
      # every chunk 404s at the domain root.
      - name: Build Storybook
        run: npm run build-storybook
        env:
          STORYBOOK_BASE: /storybook/

      - name: Assemble site
        run: |
          rm -rf site
          mkdir -p site/storybook
          cp -r dist-site/. site/
          cp -r storybook-static/. site/storybook/

      - name: Sync to FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ vars.FTP_PORT || 21 }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          # Only the assembled build output is published — never the repo itself.
          local-dir: ./site/
          server-dir: ${{ vars.FTP_SERVER_DIR || '/' }}
