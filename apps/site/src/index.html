<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <!--
        Everything between these markers is generated per route by
        seo.ts (title, description, canonical, Open Graph, JSON-LD).
        scripts/build-site-routes.mjs swaps the block when it writes the
        sub-pages, so do not hand-edit it here.
      -->
    <!--site:head-->
    <title>EPaper — Web Components for E-Paper Displays</title>
    <!--/site:head-->

    <style>
      :root {
        --ink-sans: ui-sans-serif, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
        --ink-serif: 'Iowan Old Style', 'Charter', Georgia, 'Times New Roman', serif;
        --ink-mono: ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace;
        --ink-text-prose: 18px;
        --ink-text-body: 16px;
        --ink-text-small: 13px;
        --ink-text-caption: 12px;
        --ink-text-label: 11px;
        --ink-fg: #000;
        --ink-bg: #fff;
        --ink-border-width: 2px;
        --ink-border-width-strong: 4px;
        --ink-border: 2px solid #000;
        --ink-border-strong: 4px solid #000;
        --ink-focus-width: 3px;
        --ink-focus-offset: 2px;
        --ink-space-1: 4px;
        --ink-space-2: 8px;
        --ink-space-3: 12px;
        --ink-space-4: 16px;
        --ink-space-5: 24px;
        --ink-space-6: 32px;
        --ink-space-7: 48px;
        --ink-space-8: 64px;
        /* Kept in sync with the real bar heights by main.ts; these are the
           first-paint defaults. Mirrors site.css. */
        --site-header-h: 52px;
        --site-footbar-h: 40px;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        background: #fff;
        color: #000;
        font-family: var(--ink-sans);
        height: 100%;
      }
      html {
        scroll-padding-top: var(--site-header-h);
      }
      body {
        overflow-x: hidden;
      }
      .ink-page,
      .ink-page *,
      .ink-page *::before,
      .ink-page *::after {
        transition: none !important;
        animation: none !important;
      }
      .ink-page :focus-visible {
        outline: var(--ink-focus-width) solid #000;
        outline-offset: var(--ink-focus-offset);
      }
      .site-root {
        min-height: 100vh;
      }
      .site-header {
        position: sticky;
        top: 0;
        z-index: 20;
        background: #fff;
        border-bottom: var(--ink-border);
        padding: 12px var(--ink-space-5);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
      }
      .site-header__brand {
        font-family: var(--ink-serif);
        font-size: clamp(17px, 4.4vw, 20px);
        font-weight: 700;
        margin: 0;
        white-space: nowrap;
        color: #000;
        text-decoration: none;
      }
      .site-header__dot {
        margin: 0 8px;
        opacity: 0.6;
      }
      .site-header__sub {
        font-family: var(--ink-mono);
        font-size: var(--ink-text-small);
        letter-spacing: 0.16em;
        text-transform: uppercase;
        font-weight: 700;
      }
      #site-nav {
        display: flex;
        gap: 18px;
        font-family: var(--ink-mono);
        font-size: var(--ink-text-small);
        letter-spacing: 0.12em;
        text-transform: uppercase;
        min-width: 0;
      }
      #site-nav a {
        color: #000;
        text-decoration: none;
        padding: 4px 6px;
        border-bottom: 2px solid transparent;
        white-space: nowrap;
      }
      #site-nav a[aria-current='page'] {
        border-bottom-color: #000;
        font-weight: 700;
      }
      .site {
        scroll-snap-type: y proximity;
        scroll-behavior: auto;
      }
      .site-section {
        min-height: calc(100vh - var(--site-header-h));
        min-height: calc(100svh - var(--site-header-h));
        scroll-snap-align: start;
        scroll-margin-top: var(--site-header-h);
        padding: var(--ink-space-7) var(--ink-space-5)
          calc(var(--site-footbar-h) + var(--ink-space-6));
        max-width: 1180px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: var(--ink-space-5);
        box-sizing: border-box;
        min-width: 0;
      }
      .site-cover {
        flex: 1;
        display: grid;
        grid-template-rows: auto 1fr auto;
        gap: var(--ink-space-5);
      }
      .site-cover__hero {
        display: flex;
        flex-direction: column;
        gap: var(--ink-space-4);
        max-width: 760px;
      }
      .site-cover__tags {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .site-cover__tag {
        display: inline-flex;
        align-items: center;
        padding: 2px 8px;
        border: var(--ink-border);
        font-family: var(--ink-mono);
        font-size: var(--ink-text-small);
        letter-spacing: 0.04em;
      }
      .site-cover__hero h1 {
        font-family: var(--ink-serif);
        font-size: clamp(48px, 8vw, 92px);
        line-height: 1;
        letter-spacing: -0.02em;
        font-weight: 700;
        margin: 0;
      }
      .site-cover__lede {
        font-size: var(--ink-text-prose);
        font-family: var(--ink-serif);
        line-height: 1.5;
        max-width: 60ch;
        margin: 0;
      }
      .site-cover__cta {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }
      /* The CTAs are plain links styled as buttons — they navigate without
         JavaScript, and the critical block matches .ink-btn so there is no
         shift when the bundle's stylesheet lands. */
      .site-cover__cta .ink-btn {
        font-family: var(--ink-sans);
        font-size: 17px;
        font-weight: 600;
        min-height: 48px;
        padding: 12px 20px;
        border: var(--ink-border);
        background: #fff;
        color: #000;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        box-sizing: border-box;
      }
      .site-cover__cta .ink-btn--primary {
        background: #000;
        color: #fff;
      }
      .site-cover__stats {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 0;
        border-top: var(--ink-border);
        border-bottom: var(--ink-border);
        padding: var(--ink-space-5) 0;
      }
      .site-cover__stats > * {
        padding: 0 var(--ink-space-5);
        border-left: var(--ink-border);
        min-width: 0;
      }
      .site-cover__stats > *:first-child {
        border-left: none;
        padding-left: 0;
      }
      .site-cover__stat-label {
        font-family: var(--ink-mono);
        font-size: var(--ink-text-label);
        letter-spacing: 0.16em;
        text-transform: uppercase;
        margin-bottom: 6px;
      }
      .site-cover__stat-value {
        font-family: var(--ink-serif);
        font-size: 40px;
        font-weight: 700;
        line-height: 1;
        white-space: nowrap;
      }
      .site-footbar {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        z-index: 20;
        background: #fff;
        border-top: var(--ink-border);
        padding: 8px var(--ink-space-5);
      }
      .site-footbar__inner {
        max-width: 1180px;
        margin: 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }
      .site-footbar__by {
        font-family: var(--ink-mono);
        font-size: var(--ink-text-caption);
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      .site-footbar__by a {
        color: #000;
        text-decoration: underline;
        text-underline-offset: 3px;
      }
      e-site-pager {
        display: none;
      }

      /* Critical subset of the responsive rules in site.css — the cover is
         pre-rendered, so it has to be laid out correctly before the bundle
         arrives. Keep both copies in sync. */
      @media (max-width: 900px) {
        .site-header {
          flex-wrap: wrap;
          gap: 8px 16px;
          padding: 10px var(--ink-space-4);
        }
        #site-nav {
          order: 2;
          width: 100%;
          gap: 14px;
          overflow-x: auto;
          scrollbar-width: none;
        }
        #site-nav::-webkit-scrollbar {
          display: none;
        }
        #site-nav a {
          flex: 0 0 auto;
        }
        .site-section {
          padding-left: var(--ink-space-4);
          padding-right: var(--ink-space-4);
        }
      }
      @media (max-width: 640px) {
        .site-section {
          padding-top: var(--ink-space-6);
          padding-bottom: calc(var(--site-footbar-h) + var(--ink-space-4));
          gap: var(--ink-space-4);
        }
        .site-cover__hero h1 {
          font-size: clamp(34px, 9.5vw, 56px);
        }
        .site-cover__lede {
          font-size: var(--ink-text-body);
        }
        .site-cover__cta .ink-btn {
          flex: 1 1 auto;
        }
        .site-cover__stats {
          padding: var(--ink-space-4) 0;
        }
        .site-cover__stats > * {
          padding: 0 var(--ink-space-3);
        }
        .site-cover__stat-value {
          font-size: 28px;
        }
      }
    </style>

    <!-- Full sheets are imported from main.ts so Vite can resolve
         paths that fall outside the site root (src/site/). -->
  </head>
  <body data-route="/">
    <div class="ink-page site-root">
      <header class="site-header" id="site-header">
        <!-- The wordmark is not a heading: each page spends its single <h1>
             on what that page is actually about. -->
        <a class="site-header__brand" href="/">
          EPaper<span class="site-header__dot">·</span
          ><span class="site-header__sub">Components</span>
        </a>
        <!--
            Real links to real URLs. The nav block, including which entry
            carries aria-current, is regenerated per route by
            scripts/build-site-routes.mjs.
          -->
        <!--site:nav-->
        <nav id="site-nav" aria-label="Pages">
          <a href="/" aria-current="page">Cover</a>
          <a href="/features/">Features</a>
          <a href="/components/">Components</a>
          <a href="/showcase/">Showcase</a>
          <a href="/install/">Install</a>
          <a href="/community/">Community</a>
          <!-- Storybook lives outside this site; the href is rewritten at
               build time from VITE_STORYBOOK_BASE. -->
          <a
            class="site-nav__ext"
            id="nav-storybook"
            href="http://localhost:6006"
            data-storybook-link
            >Storybook ↗</a
          >
        </nav>
        <!--/site:nav-->
      </header>

      <!--
          Page content is generated at build time by src/site/content.ts and
          injected here — every page ships its text in the HTML, so crawlers
          that do not execute JavaScript still see all of it.
        -->
      <main class="site" id="site-main">
        <!--site:main-->
        <!--/site:main-->
      </main>

      <footer class="site-footbar" id="site-footbar">
        <div class="site-footbar__inner">
          <!--
              Previous/next are real links, regenerated per route. They are
              how a crawler walks the numbered pages in order — and the
              articles under /guides/ in their own sequence — and how the
              PgUp/PgDn keys resolve their target.
            -->
          <!--site:pagenav-->
          <nav class="site-pagenav" aria-label="Page">
            <span class="site-pagenav__folio">01 / 08</span>
            <a class="site-pagenav__next" rel="next" href="/features/">Features →</a>
          </nav>
          <!--/site:pagenav-->
          <!-- Static markup so the attribution and its backlink are in the
               served HTML on every page. -->
          <span class="site-footbar__by">
            <span class="site-footbar__prefix">Built by</span>
            <a href="https://mattes.dev" rel="me author">Marco Mattes · mattes.dev</a>
          </span>
        </div>
      </footer>

      <e-site-pager id="site-pager"></e-site-pager>
    </div>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
