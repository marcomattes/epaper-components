# SonarQube Cloud analysis for @marcomattes/epaper-components
#
# Run by the `sonar` job in .github/workflows/ci.yml after the test job has
# produced reports/. Nothing here is secret — the token lives in the
# SONAR_TOKEN repository secret.
#
# To reproduce an analysis locally:
#
#   npm run test:coverage:ci
#   SONAR_TOKEN=<your token> npx sonarqube-scanner
#
# Automatic Analysis must be OFF in SonarQube Cloud (Project → Administration →
# Analysis Method), otherwise it races this workflow and no coverage is ever
# attached: Automatic Analysis never sees the reports produced by CI.

sonar.projectKey=marcomattes_epaper-components
sonar.organization=marcomattes
sonar.projectName=epaper-components
sonar.links.homepage=https://epaper-components.dev/
sonar.links.scm=https://github.com/marcomattes/epaper-components
sonar.links.issue=https://github.com/marcomattes/epaper-components/issues

# ---------------------------------------------------------------- scope

sonar.sourceEncoding=UTF-8

# `sources` and `tests` are both the repository root on purpose. Sonar then
# splits the indexed files by `test.inclusions` instead of by directory, which
# is what a layout like this needs: src/components/foo.ts is production code
# while src/components/__tests__/foo.test.ts sits underneath it. Listing the
# two as separate paths would make Sonar index src/components twice and fail.
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=\
  packages/epaper-components/src/**/__tests__/**,\
  packages/epaper-components/src/**/*.test.ts,\
  packages/epaper-components/src/**/*.spec.ts,\
  packages/epaper-components/src/stories/**,\
  apps/sample-app/**

# Build output, generated files and vendored lockfiles. `reports/` has to be
# excluded explicitly: the scanner runs after the tests, so the directory
# exists on disk by the time the project is indexed.
sonar.exclusions=\
  packages/epaper-components/dist/**,\
  dist-site/**,\
  storybook-static/**,\
  node_modules/**,\
  reports/**,\
  coverage/**,\
  test-results/**,\
  playwright-report/**,\
  **/__screenshots__/**,\
  apps/site/src/public/**,\
  package-lock.json

# ------------------------------------------------------------- coverage

sonar.javascript.lcov.reportPaths=reports/coverage/lcov.info
sonar.testExecutionReportPaths=reports/test/sonar.xml

# The mirror image of `coverage.include` in vitest.config.ts. Sonar treats a
# source file with no entry in lcov.info as 0% covered, so everything the test
# run deliberately does not measure has to be named here or the project ratio
# collapses to a number that means nothing.
#
#   src/demo, src/site   Application shells for the playground and the website;
#                        exercised by the site build, not by unit tests.
#   src/index.ts         A barrel of re-exports with no logic of its own.
#   src/core/types.ts    Type-only module; erased at runtime.
#   scripts/**           Build tooling, verified by the build itself.
#   sample-app/**        A CI validation harness, not shipped code: it asserts
#                        README.md's claims against dist/ and is run by
#                        `validate:sample-app`, never by Vitest.
sonar.coverage.exclusions=\
  packages/epaper-components/src/demo/**,\
  apps/site/src/**,\
  packages/epaper-components/src/stories/**,\
  packages/epaper-components/src/index.ts,\
  packages/epaper-components/src/core/types.ts,\
  packages/*/scripts/**,\
  apps/*/scripts/**,\
  apps/sample-app/**,\
  apps/storybook/.storybook/**,\
  *.config.ts,\
  *.config.mjs,\
  packages/*/*.config.ts,\
  packages/*/*.config.mjs,\
  apps/*/*.config.ts,\
  apps/*/*.config.mjs,\
  packages/epaper-components/index.html

# Component files repeat a deliberate shape (observedAttributes, a guarded
# connectedCallback, surgical attributeChangedCallback updates) that
# CONTRIBUTING.md mandates, and stories repeat their own boilerplate. Flagging
# that as duplication would bury the duplication that actually matters.
sonar.cpd.exclusions=\
  packages/epaper-components/src/stories/**,\
  packages/epaper-components/src/demo/**,\
  apps/site/src/**,\
  packages/epaper-components/src/**/__tests__/**,\
  apps/sample-app/fixtures/**,\
  packages/epaper-components/index.html

# ---------------------------------------------------------------- misc

# Lets the TypeScript analyzer resolve types instead of falling back to a
# syntax-only parse, which is what makes the type-aware rules fire.
sonar.typescript.tsconfigPaths=tsconfig.json

# Blame data for new-code detection and issue assignment. The CI job checks out
# with fetch-depth 0 so the full history is present.
sonar.scm.provider=git
